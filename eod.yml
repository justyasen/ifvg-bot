name: eod
on:
  schedule:
    # ~30 min before the flatten time, for normal (16:00) and early (13:00) closes, summer and winter.
    - cron: "25 16 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "25 19 * * 1-5"
    - cron: "25 20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eod
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python eod.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit trade log
        run: |
          git config user.name "ifvg-bot"
          git config user.email "ifvg-bot@users.noreply.github.com"
          git add trades.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "log $(date -u +%F)" && git push)
